<div class="container my-3 my-md-4 home-card-wrapper">
  <div class="glass-card p-3 p-sm-4 p-md-5 fade-in-up">
    <p class="eyebrow mb-1">> SYSTEM_URL_SHORTENER v0.1</p>
    <h1 class="title mb-4">Turn long links into short URLs and QR</h1>

    <form [formGroup]="urlForm" (ngSubmit)="shortenUrl()">
      <label class="form-label text-white mb-2 small fw-bold" for="urlInput">ENTER LONG URL:</label>
      <div class="input-group">
        <input
          id="urlInput"
          type="url"
          class="form-control bg-dark-input shadow-none py-2.5"
          formControlName="originalUrl"
          placeholder="https://example.com/very/long/url"
          autocomplete="off"
        />
        <button class="btn btn-brand px-4 shadow-none" type="submit" [disabled]="isSubmitting">
          <span *ngIf="!isSubmitting">EXEC_SHORTEN</span>
          <span
            *ngIf="isSubmitting"
            class="spinner-border spinner-border-sm"
            role="status"
            aria-hidden="true"
          ></span>
        </button>
      </div>

      <!-- Bright High-Contrast Validation Notice -->
      <p *ngIf="hasUrlError" class="validation-notice mt-2 mb-0 small fw-bold">
        [NOTICE] Enter a valid URL starting with <strong>http://</strong> or
        <strong>https://</strong>.
      </p>
    </form>

    <!-- High-Contrast Status Alert -->
    <div
      *ngIf="apiMessage"
      class="alert py-2.5 px-3 mt-4 mb-0 rounded-0"
      [ngClass]="apiMessage.type === 'success' ? 'alert-retro-success' : 'alert-retro-danger'"
    >
      {{ apiMessage.text }}
    </div>

    <!-- Result Card -->
    <div *ngIf="createdLink" class="result-card mt-4 p-3 p-md-4">
      <div class="row align-items-center g-4">
        <!-- Left Side: Short Link & Actions -->
        <div class="col-md-8">
          <p class="output-label mb-1">[OUTPUT] Generated short URL:</p>
          <a
            class="generated-link mb-3 d-inline-block fs-5"
            target="_blank"
            rel="noopener"
            [href]="createdLink.short_url"
          >
            {{ createdLink.short_url }}
          </a>

          <div class="d-flex flex-wrap gap-2">
            <button
              class="btn btn-sm btn-brand px-3 py-1.5"
              type="button"
              (click)="copyLink(createdLink.short_url)"
            >
              [ COPY ]
            </button>
            <a
              class="btn btn-sm btn-brand px-3 py-1.5 text-decoration-none"
              target="_blank"
              rel="noopener"
              [href]="createdLink.short_url"
            >
              [ OPEN ]
            </a>
          </div>
        </div>

        <!-- Right Side: Clean QR Code -->
        <div class="col-md-4 text-center text-md-end">
          <div class="qr-home-box p-3 d-inline-block">
            <div *ngIf="isQrLoading" class="spinner-border text-success my-2" role="status"></div>
            <img
              *ngIf="!isQrLoading && generatedQrUrl"
              [src]="generatedQrUrl"
              alt="Generated QR Code"
              class="img-fluid border border-secondary bg-white p-2"
              style="max-width: 120px"
            />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
